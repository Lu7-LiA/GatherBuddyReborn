name: Sync Upstream and Publish Crystal Build

on:
  schedule:
    # 03:17 JST. Avoid the start of the hour, when scheduled runs are busiest.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  Sync:
    runs-on: windows-latest
    steps:
      - name: Checkout Personal Branch
        uses: actions/checkout@v6
        with:
          ref: personal/special-nodes
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge Upstream
        id: merge
        shell: pwsh
        run: |
          git remote add upstream https://github.com/FFXIV-CombatReborn/GatherBuddyReborn.git
          git fetch --no-tags upstream main

          git merge-base --is-ancestor upstream/main HEAD
          if ($LASTEXITCODE -eq 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_update=false"
            if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "should_build=true"
              Write-Host "Already current; running the requested verification build."
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "should_build=false"
              Write-Host "Already current; nothing to do."
            }
            exit 0
          }

          git merge --no-edit upstream/main
          if ($LASTEXITCODE -ne 0) {
            git status --short
            Write-Error "Upstream merge conflicted. The personal branch was not changed."
            exit 1
          }

          git submodule sync --recursive
          git submodule update --init --recursive
          Add-Content -Path $env:GITHUB_OUTPUT -Value "has_update=true"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "should_build=true"

      - name: Resolve Release Version
        if: steps.merge.outputs.should_build == 'true'
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $latest = Invoke-RestMethod -Uri "https://api.github.com/repos/FFXIV-CombatReborn/GatherBuddyReborn/releases/latest" -Headers $headers
          $upstreamVersion = [Version]($latest.tag_name.TrimStart("v"))
          $revision = $upstreamVersion.Revision + [int]$env:GITHUB_RUN_NUMBER
          if ($revision -gt 65535) {
            throw "The generated version revision exceeds the .NET version limit."
          }

          $releaseVersion = "{0}.{1}.{2}.{3}" -f $upstreamVersion.Major, $upstreamVersion.Minor, $upstreamVersion.Build, $revision
          $releaseTag = "crystal-v$($releaseVersion.Replace('.', '-'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_version=$releaseVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=$releaseTag"
          Write-Host "Upstream release: $upstreamVersion; crystal release: $releaseVersion"

      - name: Set up .NET
        if: steps.merge.outputs.should_build == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud Latest
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        if: steps.merge.outputs.should_build == 'true'
        run: dotnet restore Gatherbuddy/Gatherbuddy.csproj

      - name: Build Plugin
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.release_version }}"
          dotnet build --no-restore -c Release Gatherbuddy/Gatherbuddy.csproj --output .\build `
            -p:AssemblyVersion=$version `
            -p:FileVersion=$version `
            -p:PackageVersion=$version `
            -p:InformationalVersion=$version

      - name: Build raphael-cli
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/KonaeAkira/raphael-rs.git raphael-rs-temp
          Set-Location raphael-rs-temp
          cargo build --release --package raphael-cli
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build raphael-cli."
            exit 1
          }
          Copy-Item -Path ".\target\release\raphael-cli.exe" -Destination "..\build\raphael-cli.exe" -Force

      - name: Package Plugin
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath ".\build\GatherBuddyReborn.json" -Raw | ConvertFrom-Json
          $expectedVersion = "${{ steps.version.outputs.release_version }}"
          if ($manifest.AssemblyVersion -ne $expectedVersion) {
            throw "Built manifest version '$($manifest.AssemblyVersion)' does not match '$expectedVersion'."
          }
          if ($manifest.InternalName -ne "GatherBuddyReborn") {
            throw "The InternalName changed unexpectedly."
          }
          if (-not (Test-Path -LiteralPath ".\build\GatherBuddyReborn.dll")) {
            throw "GatherBuddyReborn.dll was not produced."
          }
          if (-not (Test-Path -LiteralPath ".\build\raphael-cli.exe")) {
            throw "raphael-cli.exe was not produced."
          }

          New-Item -ItemType Directory -Path ".\artifacts" -Force | Out-Null
          Compress-Archive -Path ".\build\*" -DestinationPath ".\artifacts\GatherBuddyReborn.zip" -Force

      - name: Push Verified Upstream Merge
        if: steps.merge.outputs.has_update == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" HEAD:personal/special-nodes

      - name: Publish GitHub Release
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.release_tag }}"
          $title = "GatherBuddy Reborn + Crystal ${{ steps.version.outputs.release_version }}"
          $notes = "Automated personal build synchronized with upstream GatherBuddyReborn. This is an unofficial modified build and is not supported by the upstream project."

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag ".\artifacts\GatherBuddyReborn.zip" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag ".\artifacts\GatherBuddyReborn.zip" `
              --repo "${{ github.repository }}" `
              --target "personal/special-nodes" `
              --title $title `
              --notes $notes
          }

      - name: Generate Custom Repository Manifest
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.release_tag }}"
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/GatherBuddyReborn.zip"
          .\.github\scripts\New-PluginMaster.ps1 `
            -ManifestPath ".\build\GatherBuddyReborn.json" `
            -OutputPath ".\pluginmaster.json" `
            -DownloadUrl $downloadUrl

          $repository = Get-Content -LiteralPath ".\pluginmaster.json" -Raw | ConvertFrom-Json
          if ($repository.Count -ne 1 -or $repository[0].AssemblyVersion -ne "${{ steps.version.outputs.release_version }}") {
            throw "pluginmaster.json validation failed."
          }

      - name: Commit Repository Manifest
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        run: |
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish crystal build ${{ steps.version.outputs.release_version }}"
          }

      - name: Push Repository Manifest
        if: steps.merge.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" HEAD:personal/special-nodes
